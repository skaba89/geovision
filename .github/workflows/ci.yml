name: GeoVision CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_server.py
      - run: for file in site/*.js; do node --check "$file"; done
      - run: docker build -t geovision-ci .
      - name: Smoke test
        run: |
          docker run -d --name geovision-ci -p 127.0.0.1:8400:8080 geovision-ci
          trap 'docker logs geovision-ci || true; docker rm -f geovision-ci >/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8400/healthz; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' geovision-ci)" != true ]; then
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --max-time 5 -fsS http://127.0.0.1:8400/ >/dev/null
          curl --max-time 5 -fsS http://127.0.0.1:8400/detection.html >/dev/null
          test "$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8400/espace.html)" = 404
